# ======================================================================================
# Application: BioData Catalyst (BDC) Data Portal - Cohort Builder Service
# Module: core
# Based on NHLBI DeploymentConfig Template V1.3
#
# Last Update by: Rudra Patel   Last Update date: 10/28/2026
# ======================================================================================
apiVersion: template.openshift.io/v1
kind: Template
labels:
  template: ${APPNAME}
metadata:
  annotations:
    description: This template is for application deployment
    tags: java,general,springboot,pipeline
  name: ${APPNAME}

objects:

  # ---------------------------------------------------------------------
  # Application deployment configuration details
  # ---------------------------------------------------------------------
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${APPNAME}
        version: ${VERSION_NUM}
        env: ${ENV}
        tags.datadoghq.com/env: ${ENV}
        tags.datadoghq.com/service: ${APPNAME}
        tags.datadog.com/version: ${VERSION_NUM}
      name: ${APPNAME}-${VERSION_NUM}-${ENV}
      namespace: ${NAMESPACE}
    spec:
      replicas: "${{REPLICA_COUNT}}"
      selector:
        matchLabels:
          name: ${APPNAME}-${VERSION_NUM}-${ENV}
      template:
        metadata:
          labels:
            name: ${APPNAME}-${VERSION_NUM}-${ENV}
            app: ${APPNAME}
            version: ${VERSION_NUM}
            env: ${ENV}
            tags.datadoghq.com/env: ${ENV}
            tags.datadoghq.com/service: ${APPNAME}
            tags.datadog.com/version: ${VERSION_NUM}
        spec:
          containers:
            - name: ${APPNAME}-${VERSION_NUM}
              env:
                - name: TZ
                  value: America/New_York
                - name: SPRING_CONFIG_LOCATION
                  value: /var/${APPNAME}/config/
                - name: _JAVA_OPTIONS
                  valueFrom:
                    secretKeyRef:
                      name: nih-ca-certs
                      key: java-options
                - name: DD_ENV
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: 'metadata.labels[''tags.datadoghq.com/env'']'
                - name: DD_SERVICE
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: 'metadata.labels[''tags.datadoghq.com/service'']'
                - name: DD_VERSION
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: 'metadata.labels[''tags.datadoghq.com/version'']'
                - name: DD_AGENT_HOST
                  value: datadog-agent.datadog.svc.cluster.local
                - name: GRAPHIQL_ENABLED
                  value: "${GRAPHIQL_ENABLED}"

              ports:
                - containerPort: "${{CONTAINER_PORT}}"

              image: ${IMAGE_REGISTRY_URL}/${REGISTRY_NAMESPACE}/${APPNAME}:${VERSION_NUM}-${ENV}
              imagePullPolicy: Always
              volumeMounts:
                - name: config-volume
                  mountPath: /var/${APPNAME}/config/
                - name: nih-ca-certs
                  readOnly: true
                  mountPath: /nihchaincerts
          dnsPolicy: ClusterFirst
          volumes:
            - name: config-volume
              configMap:
                name: ${APPNAME}-${VERSION_NUM}-${ENV}
            - name: nih-ca-certs
              secret:
                secretName: nih-ca-certs

  #Start Config Map
  - kind: ConfigMap
    apiVersion: v1
    metadata:
      labels:
        app: ${APPNAME}
        version: ${VERSION_NUM}
        env: ${ENV}
      name: ${APPNAME}-${VERSION_NUM}-${ENV}
      namespace: ${NAMESPACE}
    data:
      application.properties: |
        spring.application.name=bdc-data-portal-cohort-builder-service
        server.port=${CONTAINER_PORT}
        server.shutdown=graceful
        server.forward-headers-strategy=framework
        management.endpoints.web.exposure.include=health,info
        management.endpoint.health.probes.enabled=true
        management.endpoint.health.show-details=never
        management.health.livenessstate.enabled=true
        management.health.readinessstate.enabled=true
        info.app.name=bdc-data-portal-cohort-builder-service
        info.app.environment=${ENV}
        logging.level.root=INFO
        logging.level.gov.nih.nhlbi.bdc=${LOGGING_LEVEL}
        
        spring.graphql.http.path=/api/cb/open/query
        spring.graphql.schema.locations=classpath:graphql/core/
        spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}
        spring.graphql.graphiql.path=/cb/graphiql
  
        spring.graphql.cors.allowed-origins=${FRONTEND_ORIGINS:}
        spring.graphql.cors.allowed-origin-patterns=${FRONTEND_ORIGIN_PATTERNS:}
        spring.graphql.cors.allowed-methods=POST
        spring.graphql.cors.allowed-headers=Content-Type
  
        monarch.base-url=${MONARCH_BASE_URL:https://api.monarchinitiative.org/v3/api}
        monarch.connect-timeout=${MONARCH_CONNECT_TIMEOUT:5s}
        monarch.read-timeout=${MONARCH_READ_TIMEOUT:15s}
  
        harmonized.enabled=${HARMONIZED_ENABLED:true}
        harmonized.index=${HARMONIZED_INDEX:classpath:harmonized/catalogs/manifest.json}
        harmonized.max-matches=${HARMONIZED_MAX_MATCHES:25}
  
        summary.scenarios=classpath:summary/scenarios.json
    #End Config Map

  # ---------------------------------------------------------------------
  # Service
  # ---------------------------------------------------------------------
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${APPNAME}
        version: ${VERSION_NUM}
        env: ${ENV}
      name: ${APPNAME}-${VERSION_NUM}-${ENV}
      namespace: ${NAMESPACE}
    spec:
      ports:
        - name: web-http
          port: "${{APP_EXPOSED_PORT}}"
          protocol: TCP
          targetPort: "${{CONTAINER_PORT}}"
      selector:
        name: ${APPNAME}-${VERSION_NUM}-${ENV}
        app: ${APPNAME}
        version: ${VERSION_NUM}
      sessionAffinity: None
      type: ClusterIP
    status:
      loadBalancer: {}

  # ---------------------------------------------------------------------
  # Route - external access
  # ---------------------------------------------------------------------
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      annotations:
        haproxy.router.openshift.io/hsts_header: max-age=31536000; includeSubDomains; preload
      labels:
        app: ${APPNAME}
        version: ${VERSION_NUM}
        env: ${ENV}
      name: ${APPNAME}-${VERSION_NUM}-${ENV}
      namespace: ${NAMESPACE}
    spec:
      host: ${APPNAME}-${VERSION_NUM}-${ENV}.${ROUTE_SUFFIX}
      to:
        kind: Service
        name: ${APPNAME}-${VERSION_NUM}-${ENV}
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      wildcardPolicy: None

# The following parameters should set a default value for each application.
parameters:
  - name: ENV
    description: application environment
    required: true
    value: "dev"

  - name: APPNAME
    description: application name and module name in OpenShift
    required: true
    value: "bdc-data-portal-cohort-builder-service"

  - name: VERSION_NUM
    description: The application version number, use number and '-'
    required: true
    value: "1-0-0"

  - name: REPLICA_COUNT
    description: count of replicas
    required: true
    value: '2'

  - name: ROUTE_SUFFIX
    description: suffix for the default router
    required: true
    value: 'apps.nonprod.nhlbi.nih.gov'

  - name: CONTAINER_PORT
    description: Container port exposed for internal routing
    required: true
    value: '8090'

  - name: APP_EXPOSED_PORT
    description: Application port exposed to external access
    required: true
    value: '8443'

  - name: IMAGE_REGISTRY_URL
    description: registry url for pulling the image from the image registry
    required: true
    value: "nonprodnhlbi.azurecr.io"

  - name: NAMESPACE
    description: application target namespace / openshift project name
    required: true
    value: 'bdc-data-portal-dev'

  - name: REGISTRY_NAMESPACE
    description: image registry namespace
    required: true
    value: 'bdc-data-portal'

  - name: LOGGING_LEVEL
    description: Log level for the gov.nih.nhlbi.bdc package
    required: true
    value: "INFO"

  - name: GRAPHIQL_ENABLED
    description: Enable the GraphiQL interface
    value: "false"
