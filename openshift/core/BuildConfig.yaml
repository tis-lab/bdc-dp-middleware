# ======================================================================================
# Application: BioData Catalyst (BDC) Data Portal - Cohort Builder Service
# Module: core
# Based on NHLBI BuildConfig Template V1.1
# Last Update by: Rudra Patel   Last Update date: 10/28/2026
# ======================================================================================
apiVersion: template.openshift.io/v1
kind: Template
labels:
  template: ${APPNAME}-build-config-template
metadata:
  annotations:
    description: ITAC generic template for docker strategy based image build
    tags: docker,itac,general,pipeline,bdc
  name: ${APPNAME}-${VERSION_NUM}

objects:
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ${APPNAME}-${VERSION_NUM}
      namespace: ${NAMESPACE}
      labels:
        build: ${APPNAME}-${VERSION_NUM}
    spec:
      output:
        to:
          kind: DockerImage
          name: ${IMAGE_REGISTRY_URL}/${REGISTRY_NAMESPACE}/${APPNAME}:${VERSION_NUM}
      resources: {}
      strategy:
        type: Docker
        dockerStrategy:
          pullSecret:
            name: ${REGISTRY_SECRET}
      postCommit: {}
      source:
        type: Binary
        binary: {}

parameters:
  - name: APPNAME
    description: application name or bitbucket repo name
    required: true
    value: 'bdc-data-portal-cohort-builder-service'

  - name: VERSION_NUM
    description: The application version number, use number and '-'
    required: true
    value: '0-1-0'

  - name: NAMESPACE
    description: openshift project name or namespace
    required: true
    value: 'bdc-data-portal-dev'

  - name: IMAGE_REGISTRY_URL
    description: registry url for publishing the image. Keep the default for nonprod
    required: true
    value: 'nonprodnhlbi.azurecr.io'

  - name: REGISTRY_SECRET
    description: secret for registry authentication. Keep the default set by the DevOps team
    required: true
    value: 'nonprodacr-secret'

  - name: TAG
    description: image tag
    value: 'latest'

  - name: REGISTRY_NAMESPACE
    description: image registry namespace, such as 'clinical' or 'grants'
    required: true
    value: 'bdc-data-portal'

  - name: ENV
    description: Application environment
    required: true
    value: 'dev'