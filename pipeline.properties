# --- Notifications -----------------------------------------------------------
email.recipient=NHLBIOMITACDevOps@mail.nih.gov,<<DEV-TEAM-DL>>@mail.nih.gov

artifactory.project=bdc-cohort-builder-service

# List all the deployable application module name separated by coma (,).
application.openshift.images=core
aro.deployment.check.waittime=30
aro.deployment.check.maxretry=80
aro.image.promotion.path=dev#test,test#stage,stage#prod

# Application/build settings
application.type=java
jdk.version=21
aro.predeployment.jobstatus.waittime=60

# --- SonarQube ---------------------------------------------------------------
# --- Quality Gate ---
sonar.quality.gate.check=true

# --- Java source and test  configuration ---
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=testResults/coverage/jacoco.xml
