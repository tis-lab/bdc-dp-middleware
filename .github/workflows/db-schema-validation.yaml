name: DB schema validation
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  db-schema:
    name: DB models match DDL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: schema/tests/requirements.txt
      - name: Install validation dependencies
        run: python -m pip install -r schema/tests/requirements.txt
      - name: Compare models with hand-written DDL
        run: python schema/tests/check_schema.py
      # SchemaView (used above) resolves imports per file and silently keeps one definition when
      # two imported modules define the same name. The generators resolve nested imports from the
      # root schema and reject duplicate names, so load each model the way gen-java and
      # gen-typescript will.
      - name: Load models with the LinkML generators
        run: |
          for model in schema/db/metadata.yaml schema/db/hm_index.yaml schema/db/future/*.yaml; do
            echo "gen-yaml $model"
            gen-yaml "$model" > /dev/null
          done
