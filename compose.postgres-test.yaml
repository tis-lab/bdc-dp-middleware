# Synthetic integration tests only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-admin-only
      POSTGRES_DB: bdc_dp_hm_index
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./src/test/resources/postgres:/test-resources:ro
      - ./src/test/resources/postgres/initialize.sh:/docker-entrypoint-initdb.d/00-initialize.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d bdc_dp_hm_index"]
      interval: 5s
      timeout: 5s
      retries: 12
