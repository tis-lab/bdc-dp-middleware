[project]
name = "py-tools"
version = "0.1.0"
description = "Python command-line and other tools for the backend"
readme = "README.md"
authors = [
    { name = "Shahim Essaid", email = "shahim@essaid.com" }
]
requires-python = ">=3.14"
dependencies = [
    "linkml-runtime>=1.12.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
linkml-pg-ddl = "py_tools.linkml_pg_ddl:main"
pg-apply-ddl = "py_tools.pg_apply_ddl:main"
pg-bootstrap = "py_tools.pg_bootstrap:main"
pg-load-data = "py_tools.pg_load_data:main"
