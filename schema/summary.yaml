id: https://w3id.org/tis-lab/study-palette/summary
name: study_palette_summary
title: Study Palette summary statistics
description: >-
  Counts per study in place of rows per participant: what the API returns,
  computed on request from the BDCHM-shaped data.


  Each summary class extends the BDCHM class it summarizes: a ConditionSummary
  is a Condition with the participant replaced by a count, so it uses BDCHM's
  slots and enums unchanged.


  A response has one StudySummary per study. In it, each concept has a summary
  counting the participants with any value recorded, and that summary's values
  split the count by value. A cross, such as T2D among women, is a summary in
  the response for a narrower filter.


  Reading the counts:


  - A participant has one record per concept, so is counted under one value,
  and values never sum to more than their concept. Race is the exception:
  BDCHM allows more than one.

  - UNKNOWN is a recorded value. Recorded is not the same as known.

  - Each study is counted at the granularity it was harmonized to, which may
  differ between studies (subtypes in one, the parent term in another).
  Rolling counts up to compare such studies is out of scope for now; note
  that only PRESENT can roll up from a subtype to its parent.

  - Repeated measurements are out of scope for now; a participant is binned
  by their most recent value.

  - Counts below min_count are left out.

  - Counts are estimates.


  A summary's id depends only on what it counts, so the same summary has the
  same id in every study and every response from a release. A follow-up
  response with a narrower filter merges with the first by id.


  Because summaries subclass BDCHM records, the validator accepts a summary
  where a record belongs. Keep them in separate slots.
license: MIT

prefixes:
  linkml: https://w3id.org/linkml/
  palette: https://w3id.org/tis-lab/study-palette/

default_prefix: palette
default_range: string

imports:
  - linkml:types
  - ../synthetic/bdchm
  - terms

classes:
  Summary:
    mixin: true
    description: The fields every summary adds to its BDCHM class.
    slots:
      - id
      - participant_count
      - record_count
      - values

  Binned:
    mixin: true
    description: A bin [bin_low, bin_high); either end may be left open.
    slots:
      - bin_low
      - bin_high
      - bin_unit

  ParticipantSummary:
    is_a: Participant
    mixins:
      - Summary
      - Binned
    description: Participants by age_at_index, binned.
    slots:
      - summarized_slot
    slot_usage:
      associated_person:
        required: false
      member_of_research_study:
        required: false
      values:
        range: ParticipantSummary

  DemographySummary:
    is_a: Demography
    mixins:
      - Summary
    description: Participants by sex, race, or ethnicity.
    slots:
      - summarized_slot
    slot_usage:
      associated_participant:
        required: false
      values:
        range: DemographySummary

  ConditionSummary:
    is_a: Condition
    mixins:
      - Summary
    description: Participants with a condition recorded, by condition_status.
    slot_usage:
      associated_participant:
        required: false
      condition_provenance:
        required: false
      condition_status:
        required: false
      relationship_to_participant:
        required: false
      values:
        range: ConditionSummary

  ProcedureSummary:
    is_a: Procedure
    mixins:
      - Summary
    description: Participants with a procedure recorded, by procedure_status.
    slot_usage:
      associated_participant:
        required: false
      procedure_provenance:
        required: false
      procedure_status:
        required: false
      values:
        range: ProcedureSummary

  DrugExposureSummary:
    is_a: DrugExposure
    mixins:
      - Summary
    description: Participants with a drug exposure recorded.
    slot_usage:
      associated_participant:
        required: false
      exposure_provenance:
        required: false
      values:
        range: DrugExposureSummary

  MeasurementObservationSummary:
    is_a: MeasurementObservation
    mixins:
      - Summary
      - Binned
    description: >-
      Participants with a measurement recorded, by bin of value_quantity.
      range_low and range_high keep their BDCHM meaning (a lab's reference
      range) and are not bins.
    slot_usage:
      associated_participant:
        required: false
      values:
        range: MeasurementObservationSummary

  StudySummary:
    description: >-
      The counts for one study. It refers to a BDCHM ResearchStudy rather than
      extending one, because its counts depend on the filter and the study
      does not.
    slots:
      - research_study
      - participant_count
      - participants
      - demographics
      - conditions
      - procedures
      - drug_exposures
      - measurements

  SummaryResponse:
    tree_root: true
    description: Counts of the participants matching one filter, study by study, around the term searched for.
    slots:
      - release
      - seed
      - filter
      - min_count
      - terms
      - relations
      - research_studies
      - studies
      - records

  ParticipantRecords:
    description: Participant-level records, kept apart from summaries.
    attributes:
      record_conditions:
        description: Condition records.
        range: Condition
        multivalued: true
        inlined_as_list: true
      record_demographics:
        description: Demography records.
        range: Demography
        multivalued: true
        inlined_as_list: true
      record_measurements:
        description: MeasurementObservation records.
        range: MeasurementObservation
        multivalued: true
        inlined_as_list: true

slots:
  participant_count:
    description: How many participants match.
    range: integer
    required: true
    minimum_value: 0
  record_count:
    description: How many records match.
    range: integer
    minimum_value: 0
  values:
    description: The summary split by value. Each value repeats its parent's concept.
    range: Summary
    multivalued: true
    inlined: true
    inlined_as_list: true
  summarized_slot:
    description: The BDCHM slot summarized, for classes with no concept slot.
    range: SummarizedSlotEnum
    required: true
  bin_low:
    description: Lower bound, inclusive.
    range: decimal
  bin_high:
    description: Upper bound, exclusive.
    range: decimal
  bin_unit:
    description: Unit of the bounds, which may differ from the stored value's (ages are stored in days).
    range: UnitOfMeasurementEnum
  research_study:
    description: The study counted.
    range: ResearchStudy
    inlined: false
    required: true
  release:
    description: The index release counted. Responses merge only within a release.
    required: true
  seed:
    description: The term searched for.
    range: Term
    inlined: false
    required: true
  filter:
    description: >-
      Ids of the summaries every participant counted must match. Each study's
      participant_count is how many of its participants pass.
    range: Summary
    multivalued: true
    inlined: false
  min_count:
    description: The smallest count reported. Smaller counts are left out.
    range: integer
    required: true
    minimum_value: 1
  terms:
    description: Every term referred to, so no CURIE needs a lookup.
    range: Term
    multivalued: true
    inlined_as_list: true
  relations:
    description: Links between terms beyond their hierarchy.
    range: TermRelation
    multivalued: true
    inlined_as_list: true
  research_studies:
    description: The studies counted.
    range: ResearchStudy
    multivalued: true
    inlined_as_list: true
  studies:
    description: One block of counts per study.
    range: StudySummary
    multivalued: true
    inlined_as_list: true
  participants:
    range: ParticipantSummary
    multivalued: true
    inlined_as_list: true
  demographics:
    range: DemographySummary
    multivalued: true
    inlined_as_list: true
  conditions:
    range: ConditionSummary
    multivalued: true
    inlined_as_list: true
  procedures:
    range: ProcedureSummary
    multivalued: true
    inlined_as_list: true
  drug_exposures:
    range: DrugExposureSummary
    multivalued: true
    inlined_as_list: true
  measurements:
    range: MeasurementObservationSummary
    multivalued: true
    inlined_as_list: true
  records:
    description: Participant-level records, for callers authorized to see them.
    range: ParticipantRecords
    inlined: true

enums:
  SummarizedSlotEnum:
    permissible_values:
      sex:
      race:
      ethnicity:
      age_at_index:
