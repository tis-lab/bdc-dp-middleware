id: https://w3id.org/tis-lab/BDC-Portal/bdchm_governed
name: bdchm_governed
title: BDC-HM governed extension
description: >-
  Adds what BDC-HM lacks for access control: a required dbGaP consent group on
  every participant, and one curated ConsentGroup record per group. Every
  addition is a subclass or a new class, so no BDC-HM class, slot or enum
  changes meaning.
license: MIT
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  bdchm: https://w3id.org/bdchm/
  bdchmg: https://w3id.org/tis-lab/BDC-Portal/bdchm_governed
  DUO: http://purl.obolibrary.org/obo/DUO_
  MONDO: http://purl.obolibrary.org/obo/MONDO_

default_prefix: bdchmg
default_range: string

imports:
  - linkml:types
  - bdchm

enums:
  PrimaryDataUseEnum:
    description: One primary data use per consent group. Verify DUO identifiers against the current DUO release.
    permissible_values:
      NRES:
        meaning: DUO:0000004
        description: No restriction
      GRU:
        meaning: DUO:0000042
        description: General research use
      HMB:
        meaning: DUO:0000006
        description: Health, medical or biomedical research
      DS:
        meaning: DUO:0000007
        description: Disease-specific research
      POA:
        meaning: DUO:0000011
        description: Population origins or ancestry research only

  DataUseModifierEnum:
    description: Any number of modifiers per consent group. Verify DUO identifiers against the current DUO release.
    permissible_values:
      IRB:
        meaning: DUO:0000021
        description: Ethics approval required
      NPU:
        meaning: DUO:0000018
        description: Not-for-profit, non-commercial use only
      PUB:
        meaning: DUO:0000019
        description: Publication required
      COL:
        meaning: DUO:0000020
        description: Collaboration required
      GSO:
        meaning: DUO:0000016
        description: Genetic studies only
      NMDS:
        meaning: DUO:0000015
        description: No general methods research
      GS:
        meaning: DUO:0000022
        description: Geographical restriction
      MOR:
        meaning: DUO:0000024
        description: Publication moratorium

slots:
  consent_group_id:
    description: dbGaP consent group, written as the study accession plus a consent group number.
    pattern: '^phs\d{6}\.c\d+$'

classes:
  ConsentGroup:
    description: One dbGaP consent group and its curated meaning.
    slots:
      - consent_group_id
    slot_usage:
      consent_group_id:
        identifier: true
    attributes:
      study_accession:
        required: true
        related_mappings:
          - bdchm:accession_number
      dbgap_abbreviation:
        required: true
        description: As published by dbGaP, e.g. HMB-IRB-NPU.
      primary_data_use:
        range: PrimaryDataUseEnum
        required: true
      modifiers:
        range: DataUseModifierEnum
        multivalued: true
      disease_restriction:
        multivalued: true
        range: uriorcurie
        description: MONDO terms naming the disease(s) for DS consent.
      source_consent_text:
        required: true
        description: Consent wording from the study's dbGaP documentation.
      exact_count_eligible:
        range: boolean
        required: true
      sharing_eligible:
        range: boolean
        required: true
      eligibility_approved_by:
        required: true
      curated_by:
        required: true
      reviewed_by:
        required: true
      curated_on:
        range: date
        required: true
    rules:
      - preconditions:
          slot_conditions:
            primary_data_use:
              equals_string: DS
        postconditions:
          slot_conditions:
            disease_restriction:
              required: true

  GovernedParticipant:
    is_a: Participant
    description: A BDC-HM Participant that carries its dbGaP consent group.
    slots:
      - consent_group_id
    slot_usage:
      consent_group_id:
        required: true