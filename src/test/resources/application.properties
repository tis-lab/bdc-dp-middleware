# Test-only configuration; does not configure deployed environments.
spring.graphql.graphiql.enabled=false
spring.graphql.cors.allowed-origins=http://localhost:3000
spring.graphql.cors.allowed-origin-patterns=

monarch.base-url=http://127.0.0.1:1
