spring.application.name=bdc-data-portal-cohort-builder-service

server.port=${PORT:8090}
server.shutdown=graceful
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

info.app.name=bdc-data-portal-cohort-builder-service
info.app.environment=${ENV:local}

logging.level.root=INFO
logging.level.gov.nih.nhlbi.bdc=${APP_LOG_LEVEL:INFO}


spring.graphql.http.path=/api/cb/open/query
spring.graphql.schema.locations=classpath:graphql/core/
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}
spring.graphql.graphiql.path=/cb/graphiql
spring.graphql.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.graphql.cors.allowed-origin-patterns=${FRONTEND_ORIGIN_PATTERNS:}
spring.graphql.cors.allowed-methods=POST
spring.graphql.cors.allowed-headers=Content-Type
monarch.base-url=${MONARCH_BASE_URL:https://api.monarchinitiative.org/v3/api}
monarch.connect-timeout=${MONARCH_CONNECT_TIMEOUT:5s}
monarch.read-timeout=${MONARCH_READ_TIMEOUT:15s}
harmonized.enabled=${HARMONIZED_ENABLED:true}
harmonized.index=${HARMONIZED_INDEX:classpath:harmonized/catalogs/manifest.json}
harmonized.max-matches=${HARMONIZED_MAX_MATCHES:25}
summary.scenarios=classpath:summary/scenarios.json
