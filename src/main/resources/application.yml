spring:
  application:
    name: bdc-data-portal-cohort-builder-service

  graphql:
    http:
      path: /cb/query
    schema:
      locations: classpath:graphql/core/
      inspection:
        enabled: true
    graphiql:
      path: /cb/graphiql
      enabled: ${GRAPHIQL_ENABLED:false}
    cors:
      allowed-origins: ${FRONTEND_ORIGINS}
      allowed-origin-patterns: ${FRONTEND_ORIGIN_PATTERNS:}
      allowed-methods: POST
      allowed-headers: Content-Type

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

monarch:
  base-url: ${MONARCH_BASE_URL}
  connect-timeout: ${MONARCH_CONNECT_TIMEOUT}
  read-timeout: ${MONARCH_READ_TIMEOUT}

logging:
  level:
    gov.nih.nhlbi.bdc: ${APP_LOG_LEVEL}

harmonized:
  enabled: ${HARMONIZED_ENABLED}
  index: ${HARMONIZED_INDEX}
  max-matches: ${HARMONIZED_MAX_MATCHES}

search:
  enabled: ${SEARCH_ENABLED}
  endpoint: ${SEARCH_ENDPOINT}
  index: ${SEARCH_INDEX}
  api-key: ${SEARCH_API_KEY:}
  connect-timeout: ${SEARCH_CONNECT_TIMEOUT}
  read-timeout: ${SEARCH_READ_TIMEOUT}
summary:
  release: ${SUMMARY_RELEASE}
  min-count: ${SUMMARY_MIN_COUNT}

info:
  app:
    name: bdc-data-portal-cohort-builder-service
    environment: ${ENV}
