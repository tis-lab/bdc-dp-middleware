spring:
  application:
    name: bdc-dp-middleware
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  data-location: ${APP_DATA_LOCATION:classpath:data/}

springdoc:
  paths-to-match:
    - /api/v1/**
  show-actuator: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    try-it-out-enabled: true
    tags-sorter: alpha