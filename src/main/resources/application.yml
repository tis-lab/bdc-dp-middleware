# Default profile: term resolution only. The synthetic study feature is OFF here and is switched on
# by activating the "synthetic" profile, which layers application-synthetic.yml over this file.
spring:
  application:
    name: bdc-dp-middleware

  graphql:
    http:
      path: /graphql
    schema:
      locations: classpath:graphql/core/
      inspection:
        enabled: true
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}
    cors:
      allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: POST
      allowed-headers: Content-Type

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

monarch:
  # Serves both upstream routes: /search (terms) and /autocomplete (autocomplete).
  # https://api-v3.monarchinitiative.org/v3/api is the version-pinned alias for the same API; set
  # MONARCH_BASE_URL to it if you need to pin away from whatever /v3 currently points at.
  base-url: ${MONARCH_BASE_URL:https://api.monarchinitiative.org/v3/api}
  connect-timeout: ${MONARCH_CONNECT_TIMEOUT:5s}
  read-timeout: ${MONARCH_READ_TIMEOUT:15s}

logging:
  level:
    org.biodatacatalyst.middleware: ${APP_LOG_LEVEL:INFO}

harmonized:
  # BDC concept annotations: which harmonized variables carry each ontology concept, and across how
  # many studies. false turns the feature off — mapping status is DISABLED and mapping coverage is unknown.
  enabled: ${HARMONIZED_ENABLED:true}
  # Ingest transformation specs, one file per study and variable. Point at
  # file:/path/to/priority_variables_transform/*-ingest/*.yaml to run against a working copy.
  ingest: ${HARMONIZED_INGEST:classpath*:harmonized/*-ingest/*.yaml}
  # QA spreadsheet supplying labels, definitions and units. Optional enrichment: if it is missing
  # the variables still load with those fields null.
  variable-table: ${HARMONIZED_VARIABLE_TABLE:classpath:harmonized/harmonized_vars.tsv}
  # Ceiling on bdcVariables per search. The field is meant to list everything that matches, so this
  # is a safety valve against a very broad query rather than a tuning knob. Does not affect the
  # per-concept annotation, which always returns every variable carrying the concept.
  max-matches: ${HARMONIZED_MAX_MATCHES:25}
