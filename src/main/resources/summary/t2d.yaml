# SYNTHETIC: illustrative counts for two fictional studies, not derived from
# participant data.
#
# A search for type 2 diabetes, over participants with a fasting glucose
# measurement. Glucose is related through a curated biomarker link. Study One
# records heart conditions as subtypes and Study Two as heart disorder, so
# comparing them would need a roll-up, which this draft leaves out.

